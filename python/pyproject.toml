[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinefeat-focuser-control"
version = "0.1.0"
description = "Standalone controller (CLI + GUI) for Pinefeat focuser boards (cef168, cef135, and other boards implementing the same serial protocol)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pinefeat-focuser = "pinefeat_focuser.cli:main"
pinefeat-focuser-gui = "pinefeat_focuser.gui:main"

[tool.setuptools.packages.find]
include = ["pinefeat_focuser*"]
